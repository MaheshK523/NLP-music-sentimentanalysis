[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "music-emotion-analysis"
version = "0.1.0"
description = "Offline-first, reproducible emotion analysis for lyric datasets"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Mahesh Karthikeyan"}]
keywords = ["nlp", "music", "lyrics", "emotion-analysis"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
transformers = [
  "torch>=2.2",
  "transformers>=4.40,<6",
]
dev = [
  "build>=1.2",
]

[project.scripts]
music-emotion = "music_emotion.cli:main"

[project.urls]
Repository = "https://github.com/MK-523/NLP-music-sentimentanalysis"

[tool.setuptools.packages.find]
